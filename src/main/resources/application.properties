# ==========================================
# Fiscalização Urbana - AI Status API
# ==========================================

server.port=8080

# ---- Banco de dados (H2 para dev) ----
spring.datasource.url=jdbc:h2:file:./data/fiscalizacao-ai
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- Gemini API (GRATUITO) ----
# Gere sua chave em: https://aistudio.google.com/app/apikey
# Configure via variável de ambiente (recomendado):
#   Windows: set GEMINI_API_KEY=AIzaSy...
#   Linux/Mac: export GEMINI_API_KEY=AIzaSy...
# Ou coloque a chave diretamente abaixo para testes:
gemini.api.key=${GEMINI_API_KEY:sua-chave-aqui}
gemini.api.model=gemini-2.5-flash

# ---- CORS ----
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# ---- Logging ----
logging.level.com.fiscalizacao=INFO
logging.level.org.springframework.web=WARN
